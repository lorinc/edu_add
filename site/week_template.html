<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This Week</title>
<link rel="stylesheet" href="style.css">
<style>
.week { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 20px 24px; margin-top: 16px; }
.week h1 { display: none; }
.week h2 { font-size: 1.25rem; margin: 32px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.week h2:first-of-type { border-top: 0; }
.week h3 { text-transform: none; letter-spacing: 0; font-size: 1.05rem; color: var(--ink); margin: 22px 0 8px; }
.week a { color: var(--accent); }
.week table { display: block; overflow-x: auto; margin: 8px 0 12px; }
.week th { text-align: left; font-size: .85rem; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.week td { padding: 8px; border-top: 1px solid var(--line); color: var(--ink); width: auto; min-width: 90px; }
.week td:first-child { color: var(--ink); font-weight: 600; width: auto; white-space: nowrap; }
.week li { margin: 4px 0; }
.week code { background: var(--empty); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.week blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.week p > strong:first-child { color: var(--ink); }
.week a.timed:not([href]) { color: var(--muted); text-decoration: none; cursor: default; }
</style>
</head>
<body>
<main>
  <div class="topbar"><h1>{{TITLE}}</h1><a class="switch" href="index.html">← Progress board</a></div>
  <article class="week">
{{CONTENT}}
  </article>
</main>
<script>
// Answer links open only during self-marking, 15:00-15:45 on the reader's clock.
const OPEN = 15 * 60, CLOSE = 15 * 60 + 45;
function gate() {
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  const open = m >= OPEN && m < CLOSE;
  document.querySelectorAll('a.timed').forEach(a => {
    a.dataset.label = a.dataset.label || a.textContent;
    if (open) { a.href = a.dataset.href; a.textContent = a.dataset.label; a.removeAttribute('title'); }
    else { a.removeAttribute('href'); a.textContent = 'opens 15:00-15:45'; a.title = 'Answers open during self-marking, after your attempt'; }
  });
}
gate();
setInterval(gate, 30000);
</script>
</body>
</html>
